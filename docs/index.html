<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas de Andina Market 360</title>
  <script src="resumen.js" defer></script>
</head>
<body>
  <main>
    <h1>Ventas de Andina Market 360</h1>
    <p>Datos ficticios de las sedes de Lima, Ica y Arequipa.</p>
    <p id="estado" role="status">Cargando resumen de ventas…</p>
    <table hidden id="resumen">
      <caption>Ventas por sede en soles</caption>
      <thead><tr><th scope="col">Sede</th><th scope="col">Ventas</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th scope="row">Total</th><td id="total"></td></tr></tfoot>
    </table>
  </main>
</body>
</html>
